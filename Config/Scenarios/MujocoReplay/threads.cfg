/*
 * Scenario "MujocoReplay": run the B-Human perception modules headlessly on
 * camera frames written by robocup_mujoco -- no camera driver.
 * RobotBallPerceptor runs the original 544 ONNX model and native gates.  MujocoReplayProvider provides CameraImage, CameraInfo, CameraMatrix
 * and FrameInfo; ECImageProvider converts the YUYV image with the native code.
 *
 * The module graph is demand driven and `defaultRepresentations` means
 * "provided from outside this thread", so it must stay empty here (listing a
 * representation that the same thread also provides is rejected by
 * ModuleGraphCreator with "X is also provided by default").  The explicit
 * representationProviders below are what get instantiated.
 *
 * Validate with the stock checker:
 *   Build/Linux/CheckThreads/Develop/CheckThreads Config/Scenarios/MujocoReplay/threads.cfg
 *
 * Used by:
 *   MujocoReplay --threads Config/Scenarios/MujocoReplay/threads.cfg \
 *                 --manifest <bundle>/manifest.tsv --output <bundle>/ball_percepts.jsonl
 */
defaultRepresentations = [
];

threads = [
  {
    name = Replay;
    priority = 0;
    debugReceiverSize = 500000;
    debugSenderSize = 500000;
    debugSenderInfrastructureSize = 50000;
    executionUnit = MujocoReplay;
    representationProviders = [
      {representation = CameraImage; provider = MujocoReplayProvider;},
      {representation = CameraInfo; provider = MujocoReplayProvider;},
      {representation = CameraMatrix; provider = MujocoReplayProvider;},
      {representation = FrameInfo; provider = MujocoReplayProvider;},
      {representation = ECImage; provider = ECImageProvider;},
      {representation = BallSpecification; provider = MujocoReplayProvider;},
      {representation = RobotDimensions; provider = MujocoReplayProvider;},
      {representation = BodyContour; provider = MujocoReplayProvider;},
      {representation = FieldBoundary; provider = MujocoReplayProvider;},
      {representation = JerseyClassifier; provider = MujocoReplayProvider;},
      {representation = MeasurementCovariance; provider = MujocoReplayProvider;},
      {representation = BallPercept; provider = RobotBallPerceptor;},
      {representation = RobotPercept; provider = RobotBallPerceptor;},
    ];
  },
];
