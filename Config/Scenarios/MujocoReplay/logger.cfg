// Logger configuration for the headless MuJoCo replay scenario.
// Logging is disabled: the replay tool only needs the camera representations,
// and FrameInfo comes from the manifest instead of the robot clock.
enabled = false;

// The directory that would contain log files (unused while enabled = false).
path = "/tmp/mujoco_replay_logs";

numOfBuffers = 10;
sizeOfBuffer = 20000;
writePriority = -2;
minFreeDriveSpace = 0;

loggablePerThread = [
  MotionRequest,
];

representationsPerThread = [
  {
    thread = Replay;
    representations = [
      CameraImage,
      CameraInfo,
      CameraMatrix,
      FrameInfo,
      ECImage,
    ];
  }
];
